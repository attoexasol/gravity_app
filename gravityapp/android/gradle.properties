org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Java toolchain configuration - auto-detect Java installations
# Gradle will automatically detect and use Java 17 if available
org.gradle.java.installations.auto-detect=true

# Fix for Kotlin incremental compilation error when project and pub cache are on different drives
# Disables incremental compilation to avoid "different roots" error
# This is required when project is on E:\ drive and pub cache is on C:\ drive
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.jvm=false
kotlin.incremental.multiplatform=false
